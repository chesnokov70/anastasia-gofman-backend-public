version: '3.8'

services:
  postgres:
    image: postgres:15-alpine
    container_name: anastasia_gofman_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${DB_USER:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-postgres}
      POSTGRES_DB: ${DB_NAME:-anastasia_gofman}
    ports:
      - "${DB_PORT:-5433}:5433"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - backend-network
    command: -p 5433
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-postgres} -p 5433"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: anastasia_gofman_backend
    restart: unless-stopped
    # orts:
    #   - "192.168.0.2:${APP_PORT:-8010}:8010"
    expose:
      - "8010"
    environment:
      DB_HOST: postgres
      DB_PORT: 5433
      DB_USER: ${DB_USER:-postgres}
      DB_PASSWORD: ${DB_PASSWORD:-postgres}
      DB_NAME: ${DB_NAME:-anastasia_gofman}
      DB_SSLMODE: ${DB_SSLMODE:-disable}
    volumes:
      - ./uploads:/root/uploads
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - backend-network

  nginx:
    image: nginx:alpine
    container_name: anastasia_gofman_nginx
    restart: unless-stopped
    ports:
      - "8080:80"
      - "8443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf
      - ./uploads:/var/www/uploads:ro
    depends_on:
      - backend
    networks:
      - backend-network

volumes:
  postgres_data:
    driver: local

networks:
  backend-network:
    driver: bridge 