info:
  contact: {}
  description: Backend для галереи anastasii_gofman
  title: Art Gallery API
  version: "1.0"
paths:
  /api/arts:
    get:
      consumes:
      - application/json
      description: Получает все картины
      parameters:
      - default: 1
        description: Page number
        in: query
        name: page
        type: integer
      - default: 10
        description: Page size
        in: query
        name: size
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties: true
            type: object
        "500":
          description: Internal Server Error
          schema:
            additionalProperties:
              type: string
            type: object
      summary: Get all arts
      tags:
      - Arts
    post:
      consumes:
      - application/json
      description: Создает новую картину, все поля необязательные кроме имени, по
        этому пути нельзя передавать ФОТО, но если передаешь id автора - убедись,
        что такой есть!
      parameters:
      - description: Art
        in: body
        name: data
        required: true
        schema:
          $ref: '#/definitions/dto.CreateArtDTO'
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            $ref: '#/definitions/dto.ArtResponseDTO'
        "400":
          description: Bad Request
          schema:
            additionalProperties:
              type: string
            type: object
      summary: Create a new art
      tags:
      - Arts
  /api/arts/{id}:
    delete:
      consumes:
      - application/json
      description: Удаляет арт объект и его фотки
      parameters:
      - description: Art ID
        in: path
        name: id
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties:
              type: string
            type: object
      summary: Delete art
      tags:
      - Arts
    patch:
      consumes:
      - application/json
      description: Обновляет часть картины - все поля необязательные, поля, которые
        не передал не меняются, фото сюда не суй!
      parameters:
      - description: Art ID
        in: path
        name: id
        required: true
        type: integer
      - description: Art
        in: body
        name: kwargs
        required: true
        schema:
          $ref: '#/definitions/dto.UpdateArtDTO'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/dto.ArtResponseDTO'
        "400":
          description: Bad Request
          schema:
            additionalProperties:
              type: string
            type: object
        "500":
          description: Internal Server Error
          schema:
            additionalProperties:
              type: string
            type: object
      summary: Partial update art
      tags:
      - Arts
    put:
      consumes:
      - application/json
      description: Обновляет всю картину - все поля необязательные, но перезаписывает
        все поля, те которые не передал - обнуляются (кроме фото)
      parameters:
      - description: Art ID
        in: path
        name: id
        required: true
        type: integer
      - description: Art
        in: body
        name: data
        required: true
        schema:
          $ref: '#/definitions/dto.UpdateArtDTO'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/dto.ArtResponseDTO'
        "400":
          description: Bad Request
          schema:
            additionalProperties:
              type: string
            type: object
        "500":
          description: Internal Server Error
          schema:
            additionalProperties:
              type: string
            type: object
      summary: Full update art
      tags:
      - Arts
  /api/arts/{id}/author/{author_id}:
    post:
      consumes:
      - application/json
      description: Добавляет автора к картине
      parameters:
      - description: Art ID
        in: path
        name: id
        required: true
        type: integer
      - description: Author ID
        in: path
        name: author_id
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/dto.ArtResponseDTO'
        "400":
          description: Bad Request
          schema:
            additionalProperties:
              type: string
            type: object
        "500":
          description: Internal Server Error
          schema:
            additionalProperties:
              type: string
            type: object
      summary: Add author to art
      tags:
      - Arts
  /api/arts/{id}/main_photo:
    get:
      consumes:
      - application/json
      description: Получает главную фотографию картины
      parameters:
      - description: Art ID
        in: path
        name: id
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/entity.Photo'
      summary: Get main photo
      tags:
      - Arts
    post:
      consumes:
      - multipart/form-data
      description: Добавляет/обновляет главную фотографию к картине - передается фото
        в формате multipart/form-data в поле main_photo
      parameters:
      - description: Art ID
        in: path
        name: id
        required: true
        type: integer
      - description: Is Preview
        in: query
        name: is_preview
        type: boolean
      - description: Main Photo
        in: formData
        name: main_photo
        required: true
        type: file
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/dto.ArtResponseDTO'
        "400":
          description: Bad Request
          schema:
            additionalProperties:
              type: string
            type: object
        "500":
          description: Internal Server Error
          schema:
            additionalProperties:
              type: string
            type: object
      summary: Add main photo to art
      tags:
      - Arts
  /api/arts/{id}/photos:
    post:
      consumes:
      - multipart/form-data
      description: Добавляет фотографии к картине(имеющиеся не трогаются) - передается
        []base64 в формате multipart/form-data в поле photos
      parameters:
      - description: Art ID
        in: path
        name: id
        required: true
        type: integer
      - collectionFormat: csv
        description: Photos
        in: formData
        items:
          type: file
        name: photos
        required: true
        type: array
      produces:
      - application/json
      responses:
        "200":
          description: Art
          schema:
            $ref: '#/definitions/dto.ArtResponseDTO'
        "400":
          description: Bad Request
          schema:
            additionalProperties:
              type: string
            type: object
        "500":
          description: Internal Server Error
          schema:
            additionalProperties:
              type: string
            type: object
      summary: Add photos to art
      tags:
      - Arts
  /api/arts/with_photos:
    post:
      consumes:
      - multipart/form-data
      description: Создает картину и фотографии к ней - передается в формате multipart/form-data
        в поле main_photo, preview_photo, photos(массив)
      parameters:
      - description: JSON с любыми полями из CreateArtDTO
        in: formData
        name: data
        required: true
        type: string
        x-example: '{ "author_id": 1, "name": {"en": "Art Name", "ru": "Название Картины",
          "es": "Nombre del Arte"}, "title": {"en": "Art Title", "ru": "Заголовок",
          "es": "Título"}, "description": {"en": "Detailed description", "ru": "Детальное
          описание", "es": "Descripción detallada"}, "medium": {"en": "Oil on canvas",
          "ru": "Холст, масло", "es": "Óleo sobre lienzo"}, "technique": {"en": "Impasto",
          "ru": "Импасто", "es": "Empaste"}, "dimension_x": 120, "dimension_y": 90,
          "year": 2024, "frame": {"en": "Wooden frame", "ru": "Деревянная рама", "es":
          "Marco de madera"}, "price": 150000 }'
      - description: Main Photo
        in: formData
        name: main_photo
        type: file
      - description: Preview Photo
        in: formData
        name: preview_photo
        type: file
      - collectionFormat: csv
        description: Photos
        in: formData
        items:
          type: file
        name: photos
        type: array
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            $ref: '#/definitions/dto.ArtResponseDTO'
        "400":
          description: Bad Request
          schema:
            additionalProperties:
              type: string
            type: object
      summary: Create art with photos
      tags:
      - Arts
  /api/authors:
    get:
      consumes:
      - application/json
      description: Получаем всех авторов
      parameters:
      - description: With Arts
        in: query
        name: with_arts
        type: boolean
      - default: 1
        description: Page number
        in: query
        name: page
        type: integer
      - default: 10
        description: Page size
        in: query
        name: size
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            items:
              $ref: '#/definitions/dto.AuthorResponseWithArtsDTO'
            type: array
      summary: Get all authors
      tags:
      - Authors
    post:
      consumes:
      - application/json
      description: С кайфом создаем автора, все поля необязательные кроме имени, ну
        и в mail пихать нужно mail нормальный, но можно ничего не пихать
      parameters:
      - description: Author data
        in: body
        name: data
        required: true
        schema:
          $ref: '#/definitions/dto.CreateAuthorDTO'
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            $ref: '#/definitions/dto.AuthorResponseDTO'
        "400":
          description: Bad Request
          schema:
            additionalProperties:
              type: string
            type: object
      summary: Create author
      tags:
      - Authors
  /api/authors/{id}:
    delete:
      consumes:
      - application/json
      description: Удаляем автора
      parameters:
      - description: Author ID
        in: path
        name: id
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties:
              type: string
            type: object
      summary: Delete author
      tags:
      - Authors
    get:
      consumes:
      - application/json
      description: Получаем автора по ID
      parameters:
      - description: Author ID
        in: path
        name: id
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/dto.AuthorResponseDTO'
      summary: Get author by ID
      tags:
      - Authors
    patch:
      consumes:
      - application/json
      description: Обновляем автора частично, все поля необязательные, не передал
        = осталось прежним
      parameters:
      - description: Author ID
        in: path
        name: id
        required: true
        type: integer
      - description: Update data
        in: body
        name: data
        required: true
        schema:
          $ref: '#/definitions/dto.UpdateAuthorDTO'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/dto.AuthorResponseDTO'
        "400":
          description: Bad Request
          schema:
            additionalProperties:
              type: string
            type: object
        "500":
          description: Internal Server Error
          schema:
            additionalProperties:
              type: string
            type: object
      summary: Partial update author
      tags:
      - Authors
    put:
      consumes:
      - application/json
      description: Обновляем автора полностью, все поля необязательные, но сотрется
        вся инфа, которая была раньше и которая не передана
      parameters:
      - description: Author ID
        in: path
        name: id
        required: true
