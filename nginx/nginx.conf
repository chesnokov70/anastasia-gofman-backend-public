# HTTP блок для фронтенда (простой, без SSL проблем)
server {
    listen 80;
    server_name 91.105.196.19 anastasia-gallery.duckdns.org;
    
    client_max_body_size 200m;
    access_log /var/log/nginx/access.log;
    error_log /var/log/nginx/error.log debug;
    
    # ACME challenge для Let's Encrypt
    location /.well-known/acme-challenge/ {
        root /var/www/html;
        try_files $uri =404;
    }
    
    # Настройки для API с CORS
    location / {
        # Простые CORS заголовки для фронтенда
        add_header Access-Control-Allow-Origin * always;
        add_header Access-Control-Allow-Methods "GET, POST, PUT, DELETE, OPTIONS, PATCH" always;
        add_header Access-Control-Allow-Headers "Origin, Content-Type, Accept, Authorization, X-Requested-With" always;
        
        # Обработка preflight запросов
        if ($request_method = 'OPTIONS') {
            return 204;
        }
        
        proxy_pass http://backend:8010;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        
        # Таймауты
        proxy_connect_timeout 300s;
        proxy_send_timeout 300s;
        proxy_read_timeout 300s;
    }
    
    # Обслуживание загруженных файлов
    location /uploads/ {
        alias /var/www/uploads/;
        add_header Access-Control-Allow-Origin * always;
    }
    
    # Swagger и документация
    location /swagger/ {
        proxy_pass http://backend:8010/swagger/;
        proxy_set_header Host $host;
    }
    
    location /docs {
        proxy_pass http://backend:8010/docs;
        proxy_set_header Host $host;
    }
}

# HTTPS блок (для браузера)
server {
    listen 443 ssl http2;
    server_name 91.105.196.19 anastasia-gallery.duckdns.org;
    
    # SSL сертификаты (будут обновлены после получения Let's Encrypt)
    ssl_certificate /etc/nginx/ssl/fullchain.pem;
    ssl_certificate_key /etc/nginx/ssl/key.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    
    client_max_body_size 200m;
    access_log /var/log/nginx/access.log;
    error_log /var/log/nginx/error.log debug;
    
    # Настройки для API
    location / {
        # Заголовки безопасности
        add_header X-Frame-Options DENY always;
        add_header X-Content-Type-Options nosniff always;
        
        proxy_pass http://backend:8010;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        
        # Таймауты
        proxy_connect_timeout 300s;
        proxy_send_timeout 300s;
        proxy_read_timeout 300s;
    }
    
    # Обслуживание загруженных файлов
    location /uploads/ {
        alias /var/www/uploads/;
    }
    
    # Swagger и документация
    location /swagger/ {
        proxy_pass http://backend:8010/swagger/;
        proxy_set_header Host $host;
    }
    
    location /docs {
        proxy_pass http://backend:8010/docs;
        proxy_set_header Host $host;
    }
} 