server {
    listen 80;
    server_name 91.105.196.19;
    
    client_max_body_size 200m;
    client_body_buffer_size 128k;
    client_body_timeout 300s;
    
    access_log /var/log/nginx/access.log;
    error_log /var/log/nginx/error.log debug;
    
    # Редирект на HTTPS (если будешь использовать SSL)
    # return 301 https://$server_name$request_uri;
    
    # Настройки для API
    location / {
        proxy_pass http://backend:8010;
        proxy_http_version 1.1;
        
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
        
        # Важно для multipart/form-data
        proxy_set_header Content-Type $content_type;
        proxy_set_header Content-Length $content_length;
        
        # Таймауты для больших файлов
        proxy_connect_timeout 300s;
        proxy_send_timeout 300s;
        proxy_read_timeout 300s;
        send_timeout 300s;
        
        # Буферизация для больших запросов
        proxy_request_buffering off;
        proxy_buffering off;
        
        # Передача тела ошибок от бэкенда
        proxy_intercept_errors off;
        
        # Увеличиваем буферы для заголовков
        proxy_buffer_size 128k;
        proxy_buffers 4 256k;
        proxy_busy_buffers_size 256k;
    }
    
    # Обслуживание загруженных файлов
    location /uploads/ {
        alias /var/www/uploads/;
        expires 4000d;
        add_header Cache-Control "public, immutable";
        
        # CORS для изображений
        add_header Access-Control-Allow-Origin *;
    }
    
    # Healthcheck endpoint
    location /health {
        access_log off;
        proxy_pass http://backend:8010/health;
    }
}

