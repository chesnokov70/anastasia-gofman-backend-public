server {
    listen 80;
    server_name 91.105.196.19;
    
    # Редирект на HTTPS
    return 301 https://$server_name$request_uri;
}

# Конфигурация для HTTPS
server {
    listen 443 ssl http2;
    server_name 91.105.196.19;
    
    # SSL сертификаты
    ssl_certificate /etc/nginx/ssl/cert.pem;
    ssl_certificate_key /etc/nginx/ssl/key.pem;
    
    # Современные настройки SSL
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers ECDHE-RSA-AES128-GCM-SHA256:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-RSA-AES128-SHA256:ECDHE-RSA-AES256-SHA384:ECDHE-RSA-AES128-SHA:ECDHE-RSA-AES256-SHA:DHE-RSA-AES128-SHA256:DHE-RSA-AES128-SHA:DHE-RSA-AES256-SHA256:DHE-RSA-AES256-SHA:ECDHE-RSA-DES-CBC3-SHA:EDH-RSA-DES-CBC3-SHA:AES128-GCM-SHA256:AES256-GCM-SHA384:AES128-SHA256:AES256-SHA256:AES128-SHA:AES256-SHA:DES-CBC3-SHA:HIGH:!aNULL:!eNULL:!EXPORT:!DES:!MD5:!PSK:!RC4;
    ssl_prefer_server_ciphers on;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 5m;
    
    # HSTS заголовок для безопасности
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    
    client_max_body_size 200m;
    client_body_buffer_size 128k;
    client_body_timeout 300s;
    
    access_log /var/log/nginx/access.log;
    error_log /var/log/nginx/error.log debug;
    
    # Настройки для API
    location / {
        proxy_pass http://backend:8010;
        proxy_http_version 1.1;
        
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
        
        # Важно для multipart/form-data
        proxy_set_header Content-Type $content_type;
        proxy_set_header Content-Length $content_length;
        
        # Таймауты для больших файлов
        proxy_connect_timeout 300s;
        proxy_send_timeout 300s;
        proxy_read_timeout 300s;
        send_timeout 300s;
        
        # Буферизация для больших запросов
        proxy_request_buffering off;
        proxy_buffering off;
        
        # Передача тела ошибок от бэкенда
        proxy_intercept_errors off;
        
        # Увеличиваем буферы для заголовков
        proxy_buffer_size 128k;
        proxy_buffers 4 256k;
        proxy_busy_buffers_size 256k;
    }
    
    # Обслуживание загруженных файлов
    location /uploads/ {
        alias /var/www/uploads/;
        expires 4000d;
        add_header Cache-Control "public, immutable";
        
        # CORS для изображений
        add_header Access-Control-Allow-Origin *;
    }
    
    # Healthcheck endpoint
    location /health {
        access_log off;
        proxy_pass http://backend:8010/health;
    }
} 